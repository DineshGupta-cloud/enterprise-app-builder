name: Python Scheduled Runner

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

jobs:
  run-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-github-actions-runner

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Python application
        run: python -m app.main
