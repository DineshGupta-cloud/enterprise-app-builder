name: Python Tests

on:
  push:
    paths:
      - 'python-github-actions-runner/**'
  pull_request:
    paths:
      - 'python-github-actions-runner/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-github-actions-runner

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python-github-actions-runner/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q
